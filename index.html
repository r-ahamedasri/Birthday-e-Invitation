<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF3E2">
<meta name="description" content="Birthday invitation and guest registration">
<title>Birthday Invitation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FBF3E2'/%3E%3Cellipse cx='16' cy='14' rx='8' ry='9' fill='%23E8776B' stroke='%233B2A20' stroke-width='1.4'/%3E%3Cpath d='M16 23v5' stroke='%233B2A20' stroke-width='1.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   1 · COLOUR SETTINGS — CHANGE ANY COLOUR HERE
   ========================================================================== */
:root{
  --paper:      #FBF3E2;   /* main page background — warm cream */
  --paper-alt:  #F3E4CE;   /* alternating section background */
  --blush:      #F6DFD8;   /* note-card / soft accent background */
  --ink:        #3B2A20;   /* headings, body text, outlines */
  --ink-soft:   #7A6250;   /* secondary text */
  --ink-faint:  #A28E78;   /* faint labels */
  --coral:      #E8776B;   /* primary accent — balloons, buttons, headline */
  --coral-dark: #C85B4F;
  --sage:       #6F8F63;   /* secondary accent — leaves, "attending" pill */
  --butter:     #EFB644;   /* gold accent — stars, countdown badge */
  --sky:        #7FA6BF;   /* third balloon colour */
  --card:       #FFFCF6;   /* card fill */
  --error:      #C85B4F;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Work Sans',sans-serif;overflow-x:hidden}
body.locked{height:100svh;overflow:hidden}
.page{max-width:760px;margin:0 auto;background:var(--paper)}
h1,h2{font-family:'Fraunces',Georgia,serif;margin:0}
button{font-family:inherit}

/* ==========================================================================
   INVITATION-CARD OPENING SCREEN
   ========================================================================== */
.entrance{position:fixed;inset:0;z-index:900;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding:22px;transition:opacity .7s ease,visibility .7s ease}
.entrance.hide{opacity:0;visibility:hidden;pointer-events:none}
.entrance .drift{position:absolute;border-radius:50%;opacity:.5;filter:blur(1px);
  animation:driftSlow 7s ease-in-out infinite}
.entrance .d1{width:14px;height:14px;background:var(--sky);top:16%;left:14%;animation-delay:0s}
.entrance .d2{width:10px;height:10px;background:var(--butter);top:24%;right:16%;animation-delay:1.1s}
.entrance .d3{width:16px;height:16px;background:var(--sage);bottom:20%;left:20%;animation-delay:2.2s}
.entrance .d4{width:11px;height:11px;background:var(--coral);bottom:28%;right:18%;animation-delay:1.7s}
@keyframes driftSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}

.card-scene{perspective:1400px}
.invite-card{position:relative;display:block;border:0;background:none;padding:0;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  width:min(74vw,300px);aspect-ratio:3/4}
.invite-card:focus-visible{outline:2px solid var(--ink);outline-offset:10px;border-radius:22px}
.card-inside,.card-face{position:absolute;inset:0;border-radius:22px 22px 22px 6px;
  border:2.5px solid var(--ink);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center}
.card-inside{background:var(--blush)}
.card-face{background:var(--card);box-shadow:6px 6px 0 var(--ink);
  transform-origin:0% 50%;backface-visibility:hidden}
.card-name{font-family:'Fraunces',serif;font-style:italic;font-weight:500;
  font-size:clamp(30px,7.4vw,40px);line-height:1.05}
.card-seal{width:64px;height:64px;flex-shrink:0;border-radius:52% 48% 46% 54%/48% 52% 48% 52%;
  background:var(--butter);border:2.5px solid var(--ink);display:flex;
  align-items:center;justify-content:center}
.card-seal svg{width:28px;height:28px}
.sprig{width:44px;opacity:.8}

.flash{position:absolute;left:50%;top:44%;width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle,#fff,var(--butter) 60%,transparent 72%);
  transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none}

.invite-card.open .card-face{animation:coverOpen .7s cubic-bezier(.5,.02,.4,1) forwards}
@keyframes coverOpen{0%{transform:rotateY(0)}65%{transform:rotateY(-122deg)}
  100%{transform:rotateY(-122deg);opacity:0}}
.invite-card.open .card-seal{animation:sealPop .32s ease forwards}
@keyframes sealPop{0%{transform:scale(1) rotate(0)}45%{transform:scale(1.18) rotate(-6deg)}
  100%{transform:scale(.3) rotate(-24deg);opacity:0}}
.entrance.opening .flash{animation:flashPop .55s ease forwards}
@keyframes flashPop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
  35%{opacity:1}100%{transform:translate(-50%,-50%) scale(6);opacity:0}}

.caption{font-size:14px;color:var(--ink-soft);text-align:center;line-height:1.6}
.caption b{display:block;font-family:'Fraunces',serif;font-style:italic;font-weight:500;
  font-size:clamp(20px,4.6vw,26px);color:var(--ink);margin-bottom:4px}
.entrance.opening .caption{animation:fadeAway .4s ease forwards}
@keyframes fadeAway{to{opacity:0;transform:translateY(10px)}}

/* confetti canvas sits above everything, ignores clicks */
#confetti{position:fixed;inset:0;z-index:950;pointer-events:none}

/* ==========================================================================
   SHARED
   ========================================================================== */
.section{position:relative;padding:clamp(58px,10vw,92px) clamp(20px,6vw,40px)}
.section.alt{background:var(--paper-alt)}
.wrap{max-width:520px;margin:0 auto}
.center{text-align:center}
.eyebrow{font-size:13px;color:var(--coral-dark);font-weight:600;margin:0 0 10px}
.wavy{width:100%;height:14px;margin:30px 0;opacity:.7}
h2.title{font-style:italic;font-weight:500;font-size:clamp(28px,6vw,40px);line-height:1.15}
p.lead{font-size:clamp(16px,2.4vw,18px);line-height:1.65;color:var(--ink-soft);
  max-width:46ch;margin:16px auto 0}

.sticker-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:2px solid var(--ink);background:var(--card);color:var(--ink);
  padding:13px 22px;border-radius:999px;font-weight:600;font-size:14px;
  text-decoration:none;cursor:pointer;box-shadow:4px 4px 0 var(--ink);
  transition:transform .12s ease,box-shadow .12s ease}
.sticker-btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.sticker-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.sticker-btn:focus-visible{outline:2px solid var(--coral-dark);outline-offset:3px}
.sticker-btn.fill{background:var(--coral);color:#fff}
.sticker-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--ink)}

/* ---------- hero ---------- */
.hero{min-height:96svh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-balloons span{position:absolute;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;
  opacity:.9;animation:hover-float 6s ease-in-out infinite}
.hb1{width:46px;height:58px;background:var(--sky);top:10%;left:8%;animation-delay:.2s}
.hb2{width:34px;height:44px;background:var(--butter);top:66%;left:12%;animation-delay:1.4s}
.hb3{width:40px;height:52px;background:var(--sage);top:18%;right:9%;animation-delay:.9s}
.hb4{width:30px;height:38px;background:var(--coral);top:64%;right:13%;animation-delay:2.1s}
@keyframes hover-float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(3deg)}}
.hero-inner{position:relative;z-index:1;text-align:center;padding:0 18px}
.hero h1{font-style:italic;font-weight:500;font-size:clamp(46px,11vw,84px);line-height:1.02;letter-spacing:-.01em}
.hero .turns{display:block;font-family:'Work Sans',sans-serif;font-weight:600;font-size:clamp(15px,2.6vw,19px);
  color:var(--coral-dark);margin-top:10px}
.hero-when{margin-top:28px;font-weight:600;font-size:clamp(17px,2.6vw,20px)}
.hero-place{font-size:15px;color:var(--ink-soft);margin-top:6px}
.scroll-hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
  font-size:12px;color:var(--ink-faint);text-decoration:none;display:flex;flex-direction:column;
  align-items:center;gap:6px}
.scroll-hint .dot{width:6px;height:6px;border-radius:50%;background:var(--coral);animation:hint 1.6s ease-in-out infinite}
@keyframes hint{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(6px);opacity:1}}

/* ---------- note ---------- */
.note-card{background:var(--blush);border:2px solid var(--ink);border-radius:26px 26px 26px 6px;
  padding:clamp(28px,6vw,42px);box-shadow:5px 5px 0 var(--ink)}

/* ---------- where ---------- */
.address{font-size:17px;line-height:1.6;margin:14px 0 6px;font-weight:500}
.when-line{color:var(--ink-soft);font-size:15px;margin-bottom:22px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ---------- countdown ---------- */
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:440px;margin:30px auto 0}
.badge{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:2.5px solid var(--ink);color:var(--ink)}
.badge:nth-child(1){background:var(--coral);color:#fff;border-radius:46% 54% 58% 42%/44% 41% 59% 56%}
.badge:nth-child(2){background:var(--butter);border-radius:58% 42% 44% 56%/54% 46% 54% 46%}
.badge:nth-child(3){background:var(--sage);color:#fff;border-radius:42% 58% 52% 48%/58% 44% 56% 42%}
.badge:nth-child(4){background:var(--sky);border-radius:54% 46% 46% 54%/42% 58% 42% 58%}
.badge b{font-size:clamp(22px,5vw,30px);line-height:1;transition:transform .1s ease}
.badge b.pop{animation:digitPop .4s ease}
@keyframes digitPop{0%{transform:scale(1.3)}100%{transform:scale(1)}}
.badge span{font-size:10px;margin-top:4px;font-weight:600;opacity:.85}
.timer.done{grid-template-columns:1fr}
.timer.done .badge{aspect-ratio:auto;padding:22px;border-radius:26px}
.timer.done .badge b{font-style:italic;font-family:'Fraunces',serif;font-size:26px}

/* ---------- rsvp ---------- */
.form-card{background:var(--card);border:2px solid var(--ink);border-radius:26px;
  padding:clamp(24px,5vw,36px);box-shadow:6px 6px 0 var(--ink);text-align:left}
.seatline{text-align:center;font-size:13px;color:var(--coral-dark);font-weight:600;min-height:18px;margin-bottom:18px}
.field{margin:0 0 16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 6px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:2px solid var(--ink);
  border-radius:12px;background:var(--paper);font:15px/1.4 'Work Sans',sans-serif;color:var(--ink);outline:none}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--coral-dark);
  box-shadow:0 0 0 3px rgba(232,119,107,.2)}
.attend{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.attend input{position:absolute;opacity:0;pointer-events:none}
.attend label{margin:0;border:2px solid var(--ink);padding:13px;border-radius:12px;text-align:center;
  font-size:13px;font-weight:600;cursor:pointer;background:var(--paper)}
.attend input:checked+label.yes{background:var(--sage);color:#fff}
.attend input:checked+label.no{background:var(--ink-faint);color:#fff}
.attend input:focus-visible+label{outline:2px solid var(--coral-dark);outline-offset:2px}
.submit{width:100%;margin-top:6px;justify-content:center}
.status{min-height:20px;text-align:center;font-size:13px;font-weight:600;margin-top:12px;color:var(--sage)}
.status.bad{color:var(--error)}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- guestbook ---------- */
.guestlist{max-width:480px;margin:26px auto 0;display:flex;flex-direction:column;gap:10px}
.guestrow{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:13px 18px;border:2px solid var(--ink);border-radius:16px 16px 16px 4px;
  background:var(--card);text-align:left}
.guestrow b{font-weight:600;font-size:16px}
.guestrow em{font-style:normal;color:var(--ink-soft);font-size:13px;display:block;margin-top:2px}
.guestrow span{font-size:12px;font-weight:600;color:#fff;background:var(--sage);
  padding:5px 11px;border-radius:999px;white-space:nowrap}
.empty{padding:22px;color:var(--ink-faint);font-size:14px;line-height:1.7;text-align:center}

/* ---------- footer ---------- */
.footer{text-align:center;background:var(--ink);color:var(--paper);padding:clamp(48px,8vw,68px) 24px}
.footer .sign{font-style:italic;font-family:'Fraunces',serif;font-weight:500;font-size:clamp(38px,7vw,54px)}
.footer p{font-size:14px;line-height:1.7;margin:10px 0;opacity:.78}
.admin-link{margin-top:20px;display:inline-block;font-size:12px;color:var(--paper);opacity:.55;text-decoration:none}
.admin-link:hover{opacity:.9}

/* ==========================================================================
   HOST DASHBOARD
   ========================================================================== */
.admin{display:none;min-height:100vh;background:var(--paper-alt)}
.admin.active{display:block}
.admin-inner{max-width:900px;margin:auto;padding:32px 18px 70px}
.admin-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.admin h1{font-style:italic;font-weight:500;font-size:clamp(28px,6vw,38px)}
.admin-card{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:22px;box-shadow:6px 6px 0 var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{padding:16px 8px;border:2px solid var(--ink);border-radius:16px;text-align:center;background:var(--card)}
.stat b{display:block;font-size:26px;font-weight:700}
.stat span{font-size:10px;color:var(--ink-soft);font-weight:600}
.tablewrap{overflow-x:auto}
.admin table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.admin th,.admin td{padding:11px 9px;border-bottom:1px solid rgba(59,42,32,.16);text-align:left;vertical-align:top}
.admin th{color:var(--ink-soft);font-weight:600;font-size:11px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:rgba(59,42,32,.08);white-space:nowrap;font-weight:600}
.pill.yes{background:var(--sage);color:#fff}
.row-remove{border:2px solid var(--error);background:transparent;color:var(--error);padding:6px 11px;
  border-radius:999px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.row-remove:hover{background:var(--error);color:#fff}
.row-remove:disabled{opacity:.5;cursor:not-allowed}
.login{max-width:380px;margin:14vh auto;padding:30px;background:var(--card);border-radius:24px;
  border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);text-align:center}
.login h2{font-style:italic;font-size:30px;margin:6px 0 18px;font-weight:500}
.login input{width:100%;padding:13px;border:2px solid var(--ink);border-radius:12px;
  background:var(--paper);font:15px 'Work Sans',sans-serif;color:var(--ink)}
.login .sticker-btn{width:100%;margin-top:10px}
.error{color:var(--error);font-size:12px;margin-top:10px;min-height:14px;font-weight:600}
.hide{display:none!important}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body class="locked">

<!-- ==========================================================================
     THE INVITATION-CARD OPENING SCREEN
     ========================================================================== -->
<canvas id="confetti"></canvas>

<div id="entrance" class="entrance">
  <span class="drift d1"></span><span class="drift d2"></span>
  <span class="drift d3"></span><span class="drift d4"></span>
  <span class="flash" id="flash"></span>

  <div class="card-scene">
    <button id="inviteCard" class="invite-card" aria-label="Tap to open the invitation">
      <div class="card-inside">
        <svg class="sprig" viewBox="0 0 60 40" aria-hidden="true">
          <path d="M4 34C18 26 40 20 56 6" fill="none" stroke="var(--sage)" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M14 30c4-6 10-8 14-6" fill="none" stroke="var(--sage)" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M26 22c4-6 10-8 14-6" fill="none" stroke="var(--sage)" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M38 14c4-6 10-8 14-6" fill="none" stroke="var(--sage)" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="card-face">
        <div class="card-name" id="cardName"></div>
        <div class="card-seal">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.7Z"
              fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </div>
        <svg class="sprig" viewBox="0 0 60 40" aria-hidden="true">
          <path d="M4 34C18 26 40 20 56 6" fill="none" stroke="var(--sage)" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M14 30c4-6 10-8 14-6" fill="none" stroke="var(--sage)" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M26 22c4-6 10-8 14-6" fill="none" stroke="var(--sage)" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M38 14c4-6 10-8 14-6" fill="none" stroke="var(--sage)" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
    </button>
  </div>

  <p class="caption"><b id="captionText"></b><span id="captionTap"></span></p>
</div>

<!-- ==========================================================================
     THE INVITATION
     ========================================================================== -->
<div id="site" class="page">

  <section id="top" class="section hero">
    <div class="hero-balloons" aria-hidden="true">
      <span class="hb1"></span><span class="hb2"></span><span class="hb3"></span><span class="hb4"></span>
    </div>
    <div class="hero-inner">
      <h1><span data-bind="name"></span><span class="turns" data-bind="occasion"></span></h1>
      <div class="hero-when" data-bind="dateText"></div>
      <div class="hero-place" data-bind="venueLine"></div>
      <div class="hero-place" data-bind="timeText"></div>
    </div>
    <a class="scroll-hint" href="#invite-note" aria-label="Scroll down"><span>Scroll to read on</span><span class="dot"></span></a>
  </section>

  <section id="invite-note" class="section center">
    <div class="wrap">
      <div class="note-card">
        <h2 class="title" data-bind="noteHeading"></h2>
        <p class="lead" data-bind="noteBody"></p>
      </div>
    </div>
  </section>

  <section class="section alt center">
    <div class="wrap">
      <h2 class="title" data-bind="venueName"></h2>
      <div class="address" data-bind="venueAddress"></div>
      <div class="when-line" data-bind="whenLine"></div>
      <div class="actions">
        <a class="sticker-btn fill" id="mapsBtn" target="_blank" rel="noopener">Open in Google Maps</a>
        <button class="sticker-btn" id="calendarBtn" type="button">Add to calendar</button>
      </div>
    </div>
  </section>

  <section class="section center">
    <div class="wrap">
      <h2 class="title">Counting down to the party</h2>
      <div class="timer" id="timer">
        <div class="badge"><b id="days">00</b><span>days</span></div>
        <div class="badge"><b id="hours">00</b><span>hours</span></div>
        <div class="badge"><b id="mins">00</b><span>minutes</span></div>
        <div class="badge"><b id="secs">00</b><span>seconds</span></div>
      </div>
    </div>
  </section>

  <section id="rsvp" class="section alt center">
    <div class="wrap">
      <h2 class="title">RSVP</h2>
      <p class="lead" data-bind="rsvpDeadline"></p>
      <div class="seatline" id="seatline"></div>
      <div class="form-card">
        <form id="rsvpForm" novalidate>
          <div class="field">
            <label for="name">Your name</label>
            <input id="name" name="name" required placeholder="Full name" autocomplete="name" maxlength="60">
          </div>
          <div class="field">
            <label for="contact">Phone or email</label>
            <input id="contact" name="contact" placeholder="So we can reach you" autocomplete="tel" maxlength="80">
          </div>
          <div class="field">
            <label for="guests">How many of you</label>
            <select id="guests" name="guests" required>
              <option value="">Select</option>
              <option value="1">Just me</option>
              <option value="2">2 guests</option>
              <option value="3">3 guests</option>
              <option value="4">4 guests</option>
              <option value="5">5 guests</option>
              <option value="6">6 guests</option>
            </select>
          </div>
          <div class="field">
            <label id="attendLabel">Will you be there</label>
            <div class="attend" role="radiogroup" aria-labelledby="attendLabel">
              <input id="yes" type="radio" name="attending" value="yes" checked>
              <label class="yes" for="yes">Yes, count me in</label>
              <input id="no" type="radio" name="attending" value="no">
              <label class="no" for="no">Sadly can't make it</label>
            </div>
          </div>
          <div class="field">
            <label for="note">A note for the host (optional)</label>
            <textarea id="note" name="note" placeholder="Song request, dietary note, or just a hello" maxlength="200"></textarea>
          </div>
          <button class="sticker-btn fill submit" type="submit" id="submitBtn">Send my RSVP</button>
          <div id="rsvpStatus" class="status" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </section>

  <section class="section center">
    <div class="wrap">
      <h2 class="title">The guest list</h2>
      <div class="guestlist" id="guestlist"><div class="empty">Loading the guest list…</div></div>
    </div>
  </section>

  <footer class="footer">
    <div class="sign" data-bind="footerSign"></div>
    <p data-bind="footerLine"></p>
    <a class="admin-link" href="#admin">Host dashboard</a>
  </footer>
</div>

<!-- ==========================================================================
     HOST DASHBOARD  (your-site.com/#admin)
     ========================================================================== -->
<div id="admin" class="admin">
  <div class="admin-inner">
    <div id="adminLogin" class="login">
      <h2>Guest dashboard</h2>
      <input id="adminKey" type="password" placeholder="Host key" autocomplete="current-password">
      <button class="sticker-btn fill" id="loginBtn" type="button">Open dashboard</button>
      <div id="loginError" class="error"></div>
      <a class="admin-link" style="color:var(--ink-faint)" href="#top">Back to the invitation</a>
    </div>
    <div id="dashboard" class="hide">
      <div class="admin-top">
        <div><h1>Guest dashboard</h1></div>
        <div class="actions" style="margin:0">
          <button class="sticker-btn" id="refreshBtn" type="button">Refresh</button>
          <button class="sticker-btn" id="exportBtn" type="button">Download CSV</button>
          <a class="sticker-btn" href="#top">Invitation</a>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><b id="totalStat">0</b><span>Responses</span></div>
        <div class="stat"><b id="yesStat">0</b><span>Attending</span></div>
        <div class="stat"><b id="noStat">0</b><span>Can't come</span></div>
        <div class="stat"><b id="seatStat">0</b><span>Seats booked</span></div>
      </div>
      <div class="admin-card"><div class="tablewrap" id="tableWrap"></div></div>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   2 · PARTY SETTINGS — CHANGE THE NAME, DATE, TIME AND PLACE HERE
   ========================================================================== */
const PARTY = {
  name:          "Aleha Elnaz",
  occasion:      "Turns Two",
  monogram:      "ALEHA",

  startsAt:      "2026-10-24T19:00:00+05:30",
  endsAt:        "2026-10-24T23:30:00+05:30",

  dateText:      "Saturday, 24 October 2026",
  timeText:      "5:00 PM until late",
  whenLine:      "Saturday 24 October 2026 · 5:00 PM",
  countdownOver: "The day is here",

  venueName:     "Home",
  venueAddress:  "Kuchaveli",
  venueLine:     "Kuchaveli",
  mapsQuery:     "8.823365, 81.095251",

  coverSubtitle: "Birthday Celebration Invite",
  openLabel:     "Tap the card to open",
  heroKicker:    "You are invited to celebrate",
  noteKicker:    "A few little notes",
  noteHeading:   "Two years of love, laughter & little adventures!",
  noteBody:      "Join us for sweet moments, joyful smiles, lots of fun and, of course, plenty of cake.",
  rsvpDeadline:  "Please let us know by 10 October.",
  footerSign:    "See you there",
  footerLine:    "With love, and a table already set for you.\n\n\n\n Designed by: Mohammed Afraj\n Developed by: Ahamed Asri ",

  showEnvelopeOnce: true
};
/* ========================= END OF PARTY SETTINGS ========================== */

const PREVIEW = location.protocol === 'file:';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>'"]/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c]));

document.querySelectorAll('[data-bind]').forEach(el => {
  const v = PARTY[el.dataset.bind];
  if (typeof v === 'string') el.innerHTML = esc(v).replace(/\n/g, '<br>');
});
$('cardName').textContent = PARTY.monogram || PARTY.name;
$('captionText').textContent = PARTY.coverSubtitle;
$('captionTap').textContent = PARTY.openLabel;
document.title = PARTY.name + ' · ' + PARTY.occasion;
$('mapsBtn').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(PARTY.mapsQuery);

/* ---------- confetti ---------- */
const canvas = $('confetti'), ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();
const confettiColors = ['#E8776B','#EFB644','#6F8F63','#7FA6BF','#FFFFFF'];
let particles = [], rafOn = false;
function burstConfetti(x, y, count){
  count = count || 120;
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 13,
      vy: (Math.random() * -13) - 3,
      g: 0.32 + Math.random() * 0.14,
      size: 4 + Math.random() * 5,
      color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
      rot: Math.random() * 360,
      vr: (Math.random() - 0.5) * 12,
      life: 0,
      maxLife: 100 + Math.random() * 50
    });
  }
  if (!rafOn) { rafOn = true; requestAnimationFrame(animConfetti); }
}
function animConfetti(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot * Math.PI / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2 * 0.6, p.size, p.size * 0.6);
    ctx.restore();
  });
  particles = particles.filter(p => p.life < p.maxLife && p.y < canvas.height + 60);
  if (particles.length) requestAnimationFrame(animConfetti); else rafOn = false;
}

/* ---------- opening the invitation card ---------- */
const entrance = $('entrance'), card = $('inviteCard');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let isOpening = false;

function revealPage(instant){
  document.body.classList.remove('locked');
  scrollTo(0, 0);
  if (instant) { entrance.classList.add('hide'); return; }
  setTimeout(() => entrance.classList.add('hide'), 850);
}
function openCard(){
  if (isOpening) return;
  isOpening = true;
  try { if (PARTY.showEnvelopeOnce) sessionStorage.setItem('inv-opened', '1'); } catch (e) {}
  if (reduceMotion) { revealPage(true); return; }
  const r = card.getBoundingClientRect();
  burstConfetti(r.left + r.width / 2, r.top + r.height * 0.4, 140);
  card.classList.add('open');
  entrance.classList.add('opening');
  revealPage(false);
}
card.addEventListener('click', openCard);

let alreadySeen = false;
try { alreadySeen = PARTY.showEnvelopeOnce && sessionStorage.getItem('inv-opened') === '1'; } catch (e) {}
if (alreadySeen) { entrance.classList.add('hide'); document.body.classList.remove('locked'); }

/* ---------- live countdown ---------- */
const startTime = new Date(PARTY.startsAt).getTime();
let timerId = null;
function setDigit(el, val){
  if (el.textContent !== val) { el.textContent = val; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}
function tick(){
  const n = startTime - Date.now();
  if (!isFinite(n)) return;
  if (n <= 0) {
    $('timer').classList.add('done');
    $('timer').innerHTML = '<div class="badge"><b>' + esc(PARTY.countdownOver) + '</b></div>';
    if (timerId) clearInterval(timerId);
    return;
  }
  setDigit($('days'), String(Math.floor(n / 86400000)).padStart(2, '0'));
  setDigit($('hours'), String(Math.floor(n / 3600000) % 24).padStart(2, '0'));
  setDigit($('mins'), String(Math.floor(n / 60000) % 60).padStart(2, '0'));
  setDigit($('secs'), String(Math.floor(n / 1000) % 60).padStart(2, '0'));
}
tick();
timerId = setInterval(tick, 1000);

/* ---------- add to calendar ---------- */
function icsStamp(value){ return new Date(value).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
function download(filename, text, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 800);
}
$('calendarBtn').addEventListener('click', () => {
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Birthday Invitation//EN', 'BEGIN:VEVENT',
    'UID:' + Date.now() + '@invitation',
    'DTSTAMP:' + icsStamp(new Date()),
    'DTSTART:' + icsStamp(PARTY.startsAt),
    'DTEND:' + icsStamp(PARTY.endsAt),
    'SUMMARY:' + PARTY.name + ' — ' + PARTY.occasion,
    'LOCATION:' + PARTY.venueName + ', ' + PARTY.venueAddress.replace(/\n/g, ' '),
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  download(PARTY.name.toLowerCase().replace(/\s+/g, '-') + '-party.ics', ics, 'text/calendar');
});

/* ---------- guest list ---------- */
let publicGuests = [];
async function loadGuests(){
  try {
    const res = await fetch('/api/rsvps', { cache: 'no-store' });
    if (!res.ok) throw new Error('bad status');
    const data = await res.json();
    publicGuests = data.guests || [];
    renderGuests(data.seats || 0);
  } catch (e) {
    $('guestlist').innerHTML = PREVIEW
      ? '<div class="empty">Design preview. Names appear here once the site is on Vercel with its database connected.</div>'
      : '<div class="empty">The guest list isn’t loading. Check that the database is connected in Vercel — step 3 in the README.</div>';
  }
}
function renderGuests(seats){
  $('seatline').textContent = seats ? seats + (seats === 1 ? ' seat booked so far' : ' seats booked so far') : '';
  const el = $('guestlist');
  if (!publicGuests.length) { el.innerHTML = '<div class="empty">No one has registered yet. Be the first.</div>'; return; }
  el.innerHTML = publicGuests.map(g =>
    '<div class="guestrow"><div><b>' + esc(g.name) + '</b>' +
    (g.note ? '<em>' + esc(g.note) + '</em>' : '') +
    '</div><span>' + (g.guests === 1 ? '1 seat' : g.guests + ' seats') + '</span></div>'
  ).join('');
}
loadGuests();

/* ---------- send an RSVP ---------- */
$('rsvpForm').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.currentTarget, status = $('rsvpStatus');
  status.classList.remove('bad');

  const name = form.name.value.trim();
  const guests = form.guests.value;
  if (!name) { status.textContent = 'Please add your name so we know who to expect.'; status.classList.add('bad'); form.name.focus(); return; }
  if (!guests) { status.textContent = 'Please choose how many of you are coming.'; status.classList.add('bad'); form.guests.focus(); return; }

  const entry = {
    name, contact: form.contact.value.trim(), guests: parseInt(guests, 10),
    attending: form.attending.value, note: form.note.value.trim()
  };

  $('submitBtn').disabled = true;
  status.textContent = 'Sending…';
  try {
    const res = await fetch('/api/rsvps', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(entry)
    });
    if (!res.ok) throw new Error('failed');
    form.reset(); $('yes').checked = true;
    status.textContent = entry.attending === 'yes' ? 'You’re on the list. See you on the day.' : 'Thank you for letting us know — you’ll be missed.';
    if (entry.attending === 'yes') {
      const r = $('submitBtn').getBoundingClientRect();
      burstConfetti(r.left + r.width / 2, r.top, 100);
    }
    await loadGuests();
    if (entry.attending === 'yes') document.getElementById('rsvp').scrollIntoView({ behavior: 'smooth', block: 'end' });
  } catch (err) {
    status.textContent = PREVIEW
      ? 'Design preview — RSVPs save once the site is deployed on Vercel.'
      : 'That didn’t save. Check your connection and send it again.';
    status.classList.add('bad');
    $('rsvpForm').closest('.form-card').classList.remove('shake'); void $('rsvpForm').offsetWidth;
    $('rsvpForm').closest('.form-card').classList.add('shake');
  } finally {
    $('submitBtn').disabled = false;
  }
});

/* ---------- host dashboard ---------- */
let adminRows = [];
async function loadAdmin(key){
  const res = await fetch('/api/rsvps?key=' + encodeURIComponent(key), { cache: 'no-store' });
  if (res.status === 401) throw new Error('unauthorised');
  if (!res.ok) throw new Error('failed');
  const data = await res.json();
  adminRows = data.rsvps || [];
  renderAdmin();
}
function renderAdmin(){
  const yes = adminRows.filter(r => r.attending === 'yes');
  $('totalStat').textContent = adminRows.length;
  $('yesStat').textContent = yes.length;
  $('noStat').textContent = adminRows.length - yes.length;
  $('seatStat').textContent = yes.reduce((s, r) => s + (r.guests || 0), 0);
  if (!adminRows.length) { $('tableWrap').innerHTML = '<div class="empty">No responses yet.</div>'; return; }
  $('tableWrap').innerHTML =
    '<table><thead><tr><th>Name</th><th>Contact</th><th>Seats</th><th>Reply</th><th>Note</th><th>Sent</th><th></th></tr></thead><tbody>' +
    adminRows.map(r =>
      '<tr data-id="' + esc(r.id) + '"><td><strong>' + esc(r.name) + '</strong></td><td>' + esc(r.contact) + '</td><td>' + (r.guests || 1) +
      '</td><td><span class="pill ' + (r.attending === 'yes' ? 'yes' : '') + '">' +
      (r.attending === 'yes' ? 'Attending' : 'Can’t come') + '</span></td><td>' + esc(r.note) +
      '</td><td>' + esc(new Date(r.at).toLocaleString()) +
      '</td><td><button class="row-remove" data-id="' + esc(r.id) + '" data-name="' + esc(r.name) + '" type="button">Remove</button></td></tr>'
    ).join('') + '</tbody></table>';
}
async function deleteRSVP(id){
  const key = sessionKey();
  const res = await fetch('/api/rsvps?key=' + encodeURIComponent(key) + '&id=' + encodeURIComponent(id), { method: 'DELETE' });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'failed');
}
$('tableWrap').addEventListener('click', async e => {
  const btn = e.target.closest('.row-remove');
  if (!btn) return;
  const id = btn.dataset.id, name = btn.dataset.name || 'this guest';
  if (!confirm('Remove ' + name + '\u2019s registration? This can\u2019t be undone.')) return;
  btn.disabled = true; btn.textContent = 'Removing\u2026';
  try {
    await deleteRSVP(id);
    adminRows = adminRows.filter(r => r.id !== id);
    renderAdmin(); loadGuests();
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Remove';
    alert('Could not remove that entry. Try refreshing and try again.');
  }
});
function sessionKey(){ try { return sessionStorage.getItem('host-key') || ''; } catch (e) { return ''; } }
$('loginBtn').addEventListener('click', async () => {
  const key = $('adminKey').value.trim();
  $('loginError').textContent = '';
  if (!key) { $('loginError').textContent = 'Enter your host key.'; return; }
  try {
    await loadAdmin(key);
    try { sessionStorage.setItem('host-key', key); } catch (e) {}
    $('adminLogin').classList.add('hide'); $('dashboard').classList.remove('hide');
  } catch (e) {
    $('loginError').textContent = e.message === 'unauthorised'
      ? 'That key doesn’t match the one set in Vercel.'
      : 'Could not reach the guest list. Is the site deployed with its database connected?';
  }
});
$('adminKey').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('refreshBtn').addEventListener('click', () => loadAdmin(sessionKey()).catch(() => {}));
$('exportBtn').addEventListener('click', () => {
  if (!adminRows.length) return;
  const rows = [['Name', 'Contact', 'Seats', 'Reply', 'Note', 'Sent']].concat(
    adminRows.map(r => [r.name, r.contact, r.guests, r.attending === 'yes' ? 'Attending' : "Can't come", r.note, new Date(r.at).toLocaleString()])
  );
  const csv = rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\n');
  download('guest-list.csv', csv, 'text/csv');
});

/* ---------- switching between invitation and dashboard ---------- */
function route(){
  const isAdmin = location.hash.toLowerCase() === '#admin';
  $('site').style.display = isAdmin ? 'none' : '';
  $('admin').classList.toggle('active', isAdmin);
  if (isAdmin) {
    document.body.classList.remove('locked');
    entrance.classList.add('hide');
    const key = sessionKey();
    if (key) {
      loadAdmin(key)
        .then(() => { $('adminLogin').classList.add('hide'); $('dashboard').classList.remove('hide'); })
        .catch(() => { $('adminLogin').classList.remove('hide'); $('dashboard').classList.add('hide'); });
    } else {
      $('adminLogin').classList.remove('hide'); $('dashboard').classList.add('hide');
    }
  }
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
